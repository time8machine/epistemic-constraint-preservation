name: Agent Experiment Matrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-tests-and-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arm: [arm_a, arm_b, arm_b_prime]
        family: [f1, f2, f3, f4, f5]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Execute Smoke Tests
        run: |
          python -m pytest tests/test_smoke.py
