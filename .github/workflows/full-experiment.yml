name: ROH-Bench v0.1 full experiment

on:
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - run: python experiments/run_v0_1.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/v0.1")
          w=json.loads((p/"worlds.json").read_text())
          assert len(w)==100
          assert len({x["world_id"] for x in w})==100
          assert [sum(x["family"]==f for x in w) for f in ["threshold","parity","conjunction","relational","piecewise"]]==[20]*5
          for f in ["collapse","roh"]:
              d=json.loads((p/(f+".json")).read_text())
              assert len(d)==100
              assert all(len(x["rows"])==300 for x in d)
          print("VALIDATION PASSED: 100 worlds x 300 episodes x 2 conditions")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: roh-bench-v0.1-raw-results
          path: results/v0.1/
