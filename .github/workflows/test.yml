name: ROH-Bench tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - run: python -m roh.runner --condition both --worlds 2 --episodes 300 --seed 10000 --output results/ci
