[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roh-bench"
version = "0.1.0"
description = "Residual Obstruction Hypothesis Benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["roh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
